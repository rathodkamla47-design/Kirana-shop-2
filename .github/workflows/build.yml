name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Extract ZIP
        run: |
          rm -rf project
          mkdir project
          unzip -q shri_airavat_foods_billing_complete_v1.zip -d project

      - name: Download Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip

      - name: Find Android Project
        run: |
          echo "Android project files:"
          find project -name settings.gradle -o -name settings.gradle.kts
          find project -name build.gradle -o -name build.gradle.kts

      - name: Build APK
        run: |
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/project" \
            -name settings.gradle \
            -o -name settings.gradle.kts \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Project directory: $PROJECT_DIR"

          "$GITHUB_WORKSPACE/gradle-8.7/bin/gradle" \
            -p "$PROJECT_DIR" \
            assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: |
          find project -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shri-airavat-foods-billing-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
