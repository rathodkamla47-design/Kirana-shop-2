name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Extract ZIP
        run: |
          unzip -q shri_airavat_foods_billing_complete_v1.zip -d project

      - name: Find Android project
        run: |
          find project -name gradlew -type f

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name gradlew -type f | head -n 1)")
          chmod +x "$PROJECT_DIR/gradlew"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shri-airavat-foods-billing-apk
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
